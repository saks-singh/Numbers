{# One line chart, server-rendered as SVG. Geometry comes from
   charts.plot(); this file only draws it. See that function for why there
   is no charting library here.

   Expects: geometry (charts.plot output), label (axis caption). #}
<svg viewBox="0 0 {{ geometry.width }} {{ geometry.height }}"
     width="100%" height="{{ geometry.height }}" role="img"
     aria-label="{{ label }}" style="display:block">
  {% for tick in geometry.yticks %}
  <line x1="{{ geometry.plot.x }}" y1="{{ tick.y }}"
        x2="{{ geometry.plot.x + geometry.plot.w }}" y2="{{ tick.y }}"
        stroke="#f0f0f0" stroke-width="1"/>
  <text x="{{ geometry.plot.x - 8 }}" y="{{ tick.y + 4 }}"
        text-anchor="end" font-size="11" fill="#6b7280"
        font-family="system-ui, sans-serif">{{ tick.label }}</text>
  {% endfor %}

  {% if geometry.points %}
  <polyline points="{{ geometry.polyline }}" fill="none"
            stroke="#0b5fff" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
  {% for point in geometry.points %}
  <circle cx="{{ point.x }}" cy="{{ point.y }}" r="2.5"
          fill="{{ '#b42318' if point.status in ('failed', 'timeout', 'unreachable')
                   else '#9a6700' if point.status == 'partial' else '#0b5fff' }}">
    <title>build {{ point.label }} · {{ '%.3f'|format(point.value) }} s · {{ point.status }}</title>
  </circle>
  {% endfor %}
  {% endif %}

  {% for tick in geometry.xticks %}
  <text x="{{ tick.x }}" y="{{ geometry.height - 8 }}" text-anchor="middle"
        font-size="11" fill="#6b7280"
        font-family="system-ui, sans-serif">{{ tick.label }}</text>
  {% endfor %}
</svg>
